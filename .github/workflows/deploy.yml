# Deploys ip-api to Cloudflare Workers on every push to main.
#
# Replaces Vercel's git integration, which deployed on push until the account
# was retired. Typecheck, tests and the build all run before the deploy step,
# so any of them failing stops the deploy rather than shipping a broken worker.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ip-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: .
        run: echo 'no dependencies to install'
      - name: Build and deploy
        working-directory: .
        run: |
          npx --yes wrangler@4.127.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
